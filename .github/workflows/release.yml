name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.2)'
        required: true
        type: string

env:
  NODE_VERSION: '20'

jobs:
  # Build for all platforms in parallel
  # electron-builder with --publish always will:
  # 1. Create the GitHub release if it doesn't exist
  # 2. Upload all artifacts including latest.yml files needed for auto-update
  
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        run: npm ci

      - name: Build and Publish
        working-directory: core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (uncomment and add secrets if you have certificates)
          # CSC_LINK: ${{ secrets.MAC_CERTS }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run build
          npx electron-builder --mac --${{ matrix.arch }} --publish always

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        run: npm ci

      - name: Build and Publish
        working-directory: core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (uncomment and add secrets if you have certificates)
          # CSC_LINK: ${{ secrets.WIN_CERTS }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTS_PASSWORD }}
        run: |
          npm run build
          npx electron-builder --win --${{ matrix.arch }} --publish always

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        run: npm ci

      - name: Build and Publish
        working-directory: core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --linux --publish always

  # After all builds complete, update the release with changelog
  finalize-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 $TAG^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to $TAG"
            COMMITS=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..$TAG --no-merges 2>/dev/null || echo "")
          else
            echo "First release - getting recent commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20 --no-merges 2>/dev/null || echo "- Initial release")
          fi
          
          # Write to file to preserve newlines
          echo "$COMMITS" > /tmp/changelog.txt
          
          # Create the full release body
          cat > /tmp/release_body.md << 'RELEASE_EOF'
          ## What's Changed
          
          RELEASE_EOF
          
          cat /tmp/changelog.txt >> /tmp/release_body.md
          
          cat >> /tmp/release_body.md << 'RELEASE_EOF'
          
          ---
          
          ## Installation
          
          ### macOS
          - **Apple Silicon (M1/M2/M3)**: Download `Echolon-*-arm64.dmg`
          - **Intel**: Download `Echolon-*-x64.dmg` or `Echolon-*-mac.dmg`
          
          ### Windows  
          - **Installer**: Download `Echolon-Setup-*.exe`
          - **Portable**: Download `Echolon-*-portable.exe`
          
          ### Linux
          - **AppImage** (universal): Download `Echolon-*.AppImage`
          - **Debian/Ubuntu**: Download `echolon_*.deb`
          - **Fedora/RHEL**: Download `echolon-*.rpm`
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/PREV_TAG...${{ steps.get_version.outputs.tag }}
          RELEASE_EOF
          
          # Replace PREV_TAG placeholder
          if [ -n "$PREV_TAG" ]; then
            sed -i "s/PREV_TAG/$PREV_TAG/g" /tmp/release_body.md
          else
            # Remove the changelog link for first release
            sed -i '/Full Changelog/d' /tmp/release_body.md
          fi

      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Echolon v${{ steps.get_version.outputs.version }}
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
