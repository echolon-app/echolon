# Echolon Proxy Server - Nginx Configuration
# Place this file at /etc/nginx/conf.d/echolon-proxy.conf

# Upstream for the Node.js application
upstream echolon_proxy {
    server 127.0.0.1:3500;
    keepalive 64;
}

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name *.echolon.app echolon.app proxy.echolon.app;

    # Allow Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Main configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.echolon.app echolon.app proxy.echolon.app;

    # SSL Certificate (update paths after obtaining certificate)
    # Option 1: Let's Encrypt
    # ssl_certificate /etc/letsencrypt/live/echolon.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/echolon.app/privkey.pem;
    
    # Option 2: Self-signed (for testing only)
    ssl_certificate /etc/nginx/ssl/echolon.crt;
    ssl_certificate_key /etc/nginx/ssl/echolon.key;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/echolon-proxy.access.log;
    error_log /var/log/nginx/echolon-proxy.error.log;

    # Increase client body size for large request bodies
    client_max_body_size 10M;

    # WebSocket support for /ws endpoint
    location /ws {
        proxy_pass http://echolon_proxy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout settings
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # Regular HTTP requests
    location / {
        proxy_pass http://echolon_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (bypass proxy for direct checks)
    location /health {
        proxy_pass http://echolon_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

