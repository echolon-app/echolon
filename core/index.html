<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color-scheme="terminal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'self' blob:; frame-src 'self' blob:; connect-src *;">
    <title>Echolon</title>
    
    <!-- Record startup time as early as possible -->
    <script>
      window.__APP_START_TIME__ = performance.now();
    </script>
    
    <!-- Sync theme and font size from localStorage before any paint -->
    <script>
      (function() {
        try {
          // Read theme preference
          var storedTheme = localStorage.getItem('echolonTheme');
          var theme = storedTheme ? JSON.parse(storedTheme) : 'dark';
          
          // Handle system theme
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          
          // Read color scheme
          var storedColorScheme = localStorage.getItem('echolonColorScheme');
          var colorScheme = storedColorScheme ? JSON.parse(storedColorScheme) : 'terminal';
          
          // Apply immediately to prevent flash
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-color-scheme', colorScheme);
          
          // Read and apply font size setting
          var storedSettings = localStorage.getItem('echolonSettings');
          if (storedSettings) {
            var settings = JSON.parse(storedSettings);
            var fontSize = settings.fontSize || 13;
            var baseFontSize = 13;
            var scale = fontSize / baseFontSize;
            var root = document.documentElement;
            root.style.setProperty('--font-xs', Math.round(11 * scale) + 'px');
            root.style.setProperty('--font-sm', Math.round(12 * scale) + 'px');
            root.style.setProperty('--font-md', Math.round(13 * scale) + 'px');
            root.style.setProperty('--font-lg', Math.round(14 * scale) + 'px');
            root.style.setProperty('--font-xl', Math.round(16 * scale) + 'px');
            root.style.setProperty('--font-2xl', Math.round(18 * scale) + 'px');
            root.style.setProperty('--font-3xl', Math.round(24 * scale) + 'px');
          }
        } catch (e) {
          // Fallback to defaults already set on html element
          console.warn('Failed to load theme from localStorage:', e);
        }
      })();
    </script>
    
    <!-- Critical CSS - inline to prevent FOUC -->
    <style>
      /* ===== CSS Variables ===== */
      :root {
        /* Brand colors (defaults) */
        --color-primary: #6366f1;
        --color-primary-hover: #4f46e5;
        --color-primary-light: #818cf8;
        
        /* Spacing */
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 12px;
        --spacing-lg: 16px;
        --spacing-xl: 24px;
        
        /* Border radius */
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        
        /* Font families */
        --font-sans: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
        
        /* Transitions */
        --transition-fast: 100ms ease;
        --transition-normal: 200ms ease;
      }
      
      /* ===== Color Schemes ===== */
      [data-color-scheme='terminal'] {
        --color-primary: #22c55e;
        --color-primary-hover: #16a34a;
        --color-primary-light: #4ade80;
      }
      
      [data-color-scheme='midnight'] {
        --color-primary: #6366f1;
        --color-primary-hover: #4f46e5;
        --color-primary-light: #818cf8;
      }
      
      [data-color-scheme='ocean'] {
        --color-primary: #0ea5e9;
        --color-primary-hover: #0284c7;
        --color-primary-light: #38bdf8;
      }
      
      [data-color-scheme='sunset'] {
        --color-primary: #f97316;
        --color-primary-hover: #ea580c;
        --color-primary-light: #fb923c;
      }
      
      [data-color-scheme='rose'] {
        --color-primary: #ec4899;
        --color-primary-hover: #db2777;
        --color-primary-light: #f472b6;
      }
      
      [data-color-scheme='emerald'] {
        --color-primary: #14b8a6;
        --color-primary-hover: #0d9488;
        --color-primary-light: #2dd4bf;
      }
      
      /* ===== Dark Theme ===== */
      [data-theme='dark'] {
        --bg-primary: #0f0f1a;
        --bg-secondary: #1a1a2e;
        --bg-tertiary: #232342;
        --bg-elevated: #2a2a4a;
        --text-primary: #f8f8fc;
        --text-secondary: #a8a8c0;
        --text-tertiary: #6b6b8a;
        --border-primary: #2d2d50;
      }
      
      /* Terminal color scheme - deeper blacks */
      [data-theme='dark'][data-color-scheme='terminal'] {
        --bg-primary: #0a0a0a;
        --bg-secondary: #111111;
        --bg-tertiary: #1a1a1a;
        --bg-elevated: #222222;
        --border-primary: #222222;
      }
      
      /* ===== Light Theme ===== */
      [data-theme='light'] {
        --bg-primary: #ffffff;
        --bg-secondary: #f8f9fc;
        --bg-tertiary: #f0f2f7;
        --bg-elevated: #ffffff;
        --text-primary: #1a1a2e;
        --text-secondary: #4a4a68;
        --text-tertiary: #6b6b8a;
        --border-primary: #e2e4ea;
      }
      
      /* ===== Base Styles ===== */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      
      body {
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        line-height: 1.5;
        color: var(--text-primary);
        background-color: var(--bg-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: geometricPrecision;
      }
      
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      
      /* ===== Loading Screen ===== */
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--bg-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }
      
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      
      .loader-logo {
        width: 64px;
        height: 64px;
        animation: pulse-logo 2s ease-in-out infinite;
      }
      
      .loader-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border-primary);
        border-top-color: var(--color-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      .loader-text {
        color: var(--text-secondary);
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse-logo {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.95); }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen - hidden once React is ready -->
    <div id="app-loader">
      <div class="loader-content">
        <svg class="loader-logo" viewBox="0 0 797 795" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
              gradientTransform="translate(399.80 375.46) rotate(90) scale(597.75)">
              <stop offset="0" stop-color="#0A1A0B"/>
              <stop offset="0.55" stop-color="#061006"/>
              <stop offset="1" stop-color="#020603"/>
            </radialGradient>
            <linearGradient id="prompt" x1="260" y1="290" x2="560" y2="520" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#77F08B"/>
              <stop offset="1" stop-color="#4FE06C"/>
            </linearGradient>
            <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.8" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <filter id="ringBlur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.2"/>
            </filter>
          </defs>
          <rect x="0" y="0" width="797" height="795" rx="160" ry="160" fill="url(#bg)"/>
          <g stroke="#7FEA92" stroke-linecap="round" filter="url(#ringBlur)">
            <path d="M 292.36 189.37 A 214.88 214.88 0 0 1 507.24 189.37" stroke-width="10" opacity="0.18"/>
            <path d="M 507.24 561.56 A 214.88 214.88 0 0 1 292.36 561.56" stroke-width="10" opacity="0.18"/>
            <path d="M 213.71 482.90 A 214.88 214.88 0 0 1 213.71 268.02" stroke-width="10" opacity="0.18"/>
            <path d="M 585.89 268.02 A 214.88 214.88 0 0 1 585.89 482.90" stroke-width="10" opacity="0.18"/>
            <path d="M 266.10 143.90 A 267.39 267.39 0 0 1 533.49 143.90" stroke-width="9" opacity="0.16"/>
            <path d="M 533.49 607.03 A 267.39 267.39 0 0 1 266.10 607.03" stroke-width="9" opacity="0.16"/>
            <path d="M 168.23 509.16 A 267.39 267.39 0 0 1 168.23 241.77" stroke-width="9" opacity="0.16"/>
            <path d="M 631.36 241.77 A 267.39 267.39 0 0 1 631.36 509.16" stroke-width="9" opacity="0.16"/>
            <path d="M 238.74 96.51 A 322.11 322.11 0 0 1 560.85 96.51" stroke-width="8" opacity="0.14"/>
            <path d="M 560.85 654.42 A 322.11 322.11 0 0 1 238.74 654.42" stroke-width="8" opacity="0.14"/>
            <path d="M 120.84 536.52 A 322.11 322.11 0 0 1 120.84 214.41" stroke-width="8" opacity="0.14"/>
            <path d="M 678.75 214.41 A 322.11 322.11 0 0 1 678.75 536.52" stroke-width="8" opacity="0.14"/>
          </g>
          <g transform="translate(0.0 -35.0)" filter="url(#softGlow)" stroke="url(#prompt)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 302 330 L 378 401 L 302 472" stroke-width="28"/>
            <path d="M 412 487 L 523 487" stroke-width="26"/>
          </g>
        </svg>
        
        <div class="loader-text">Loading Echolon...</div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/renderer/index.tsx"></script>
  </body>
</html>
